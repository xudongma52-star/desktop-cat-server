# Install only as /www/server/panel/vhost/nginx/maxmeme.cn.conf.
# Other host Nginx site configurations remain owned by their existing projects.
server {
    listen 80;
    listen [::]:80;
    server_name maxmeme.cn www.maxmeme.cn;

    root /www/wwwroot/maxmeme.cn;
    access_log /www/wwwlogs/maxmeme.cn.log;
    error_log /www/wwwlogs/maxmeme.cn.error.log;

    # Keep the challenge path reachable for future certificate maintenance.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # Dedicated public HTTPS port for direct IP access; preserve Secure session cookies.
    listen 7003 ssl http2;
    server_name maxmeme.cn www.maxmeme.cn;

    client_max_body_size 11m;
    access_log /www/wwwlogs/maxmeme.cn.log;
    error_log /www/wwwlogs/maxmeme.cn.error.log;

    ssl_certificate /etc/letsencrypt/live/maxmeme.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maxmeme.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MAXMEME_SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Host proxy.conf enables a shared cache; never cache this project's sessions or API.
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 200s;

    # Article originals have no product size limit; stream to the backend.
    location /api/records/images {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:18080;
        proxy_read_timeout 200s;
    }

    location /api/events {
        proxy_pass http://127.0.0.1:18080;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
    }
}
