# Preserve the original HTTPS scheme and client address supplied by the host ingress.
# Direct container health checks do not carry these headers, so use local defaults.
map $http_x_forwarded_proto $original_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_real_ip $original_client_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name maxmeme.cn www.maxmeme.cn;

    root /usr/share/nginx/html;

    location = /container-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    index index.html;
    client_max_body_size 11m;

    location /api/events {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $original_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Article originals have no product size limit; stream to the backend.
    location /api/records/images {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $original_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_read_timeout 200s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $original_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_read_timeout 200s;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $original_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;
    }

    location /downloads/ {
        try_files $uri =404;
        add_header Content-Disposition 'attachment' always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
