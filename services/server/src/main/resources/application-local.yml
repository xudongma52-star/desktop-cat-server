# The first scaffold runs without a database. Activate postgres to enable MyBatis.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# local 配置用于脱离 PostgreSQL、Redis 检查基础应用，不让健康检查依赖外部进程。
management:
  health:
    redis:
      enabled: false
