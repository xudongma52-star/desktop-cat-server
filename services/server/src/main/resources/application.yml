server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      cookie:
        # Spring Session 默认名为 SESSION；显式沿用 JSESSIONID，确保升级前后的 Cookie 与退出清理行为一致。
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: ${AUTH_SECURE_COOKIES:false}

spring:
  application:
    name: desktop-cat-server
  profiles:
    default: postgres
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-system}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

desktop-cat:
  auth:
    # 正式环境必须通过环境变量提供稳定随机值，否则服务重启后 Web 登录记忆会失效。
    remember-me-key: ${AUTH_REMEMBER_ME_KEY:desktop-cat-local-development-key-change-me}
    secure-cookies: ${AUTH_SECURE_COOKIES:false}
  photo:
    # 数据库只保存相对路径；服务器迁移时可通过环境变量切换实际存储目录。
    storage-root: ${PHOTO_STORAGE_ROOT:./data}
